cohort: "tracerx"
citup2:  # stage0,1
  tracerx:
    citup_py: "../CITUP/citup_recomb_w_mike_mig11.py"
    num_solutions: 1
    dag_solutions: 1
    args: | 
      --max-root-out-degree 1 \
      --min-mutations-per-cluster 0 \
      --fixClusterMapping \
      --objective cluster \
      --clusterWeight equal \
      --clip-observed-at 1.0 \
      --co-presence-reward 0 \
      --mike-presence-threshold 0.025 \
      --presence-threshold 0.025 \
      --enum-max-trees 1 \
      --enum-time-limit 3600 \
      --mike-gamma 0.01 \
      --mike-node-trigger-mode proxy_all_obs \
      --mike-admissibility-mode recursive \
  sims:
    citup_py: "../CITUP/citup_recomb_w_mike_mig12.py"
